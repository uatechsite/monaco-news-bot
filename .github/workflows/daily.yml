name: Daily Monaco News Bot

on:
  schedule:
    # 08:00 UTC = 09:00 CET (Monaco time, winter) / 10:00 CEST (summer)
    - cron: "0 8 * * *"
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

jobs:
  post-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cache seen_items.json between runs using GitHub Actions cache
      - name: Restore seen items cache
        uses: actions/cache@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser anthropic requests

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py

      - name: Save seen items cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
